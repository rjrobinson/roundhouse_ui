name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      RUBY_VERSION: ruby-3.3.9
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Lowest supported, current major, and latest. Most tests use an
        # in-memory FakeRedis, so this matrix mainly proves each Sidekiq version
        # resolves and loads against our API usage — but the destructive paths
        # (pause, snapshot -> restore, bulk-on-a-filter) run against the real
        # Redis below, on every version, because the fake cannot tell us whether
        # Redis behaves the way the code assumes.
        sidekiq: [ "~> 6.5", "~> 7.0", "~> 8.0" ]

    name: test (sidekiq ${{ matrix.sidekiq }})

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.3.9
          # No bundler-cache: the Sidekiq override makes the committed
          # Gemfile.lock stale, so we resolve fresh per matrix entry.
          bundler-cache: false

      - name: Install dependencies (Sidekiq ${{ matrix.sidekiq }})
        env:
          SIDEKIQ_VERSION: ${{ matrix.sidekiq }}
        run: |
          rm -f Gemfile.lock
          bundle install --jobs 4 --retry 3

      - name: Run tests
        env:
          RAILS_ENV: test
          SIDEKIQ_VERSION: ${{ matrix.sidekiq }}
          # Database 1: the service container is ours alone, and the real-Redis
          # tests FLUSHDB whatever they are pointed at. They refuse database 0.
          ROUNDHOUSE_TEST_REDIS_URL: redis://localhost:6379/1
          # Without this a missing or unreachable Redis would skip them silently
          # and the coverage would be imaginary — which is the exact failure this
          # lane exists to prevent.
          ROUNDHOUSE_REQUIRE_REAL_REDIS: "1"
        run: bin/rails test

      # The layout carries real JavaScript and had no coverage at all. The drain
      # forecast is the first branch-heavy piece of it, and its whole job is to
      # be right about what an operator sees mid-incident. Node is a CI-only
      # dependency — the gem itself still has no build step.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run JavaScript tests
        run: node test/js/forecast_test.js

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Dedicated Solid Queue lane — varies the Solid Queue version (its schema is
  # loaded from the installed gem), so the Solid Queue backend is proven against
  # each version, not just implicitly inside the Sidekiq lanes.
  test_solid_queue:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Pinned to the patch series, not the minor. `~> 1.0` means ">= 1.0,
        # < 2.0", so it resolved to the same latest 1.x as `~> 1.5` and this
        # lane tested one version twice while reporting two.
        solid_queue: [ "~> 1.0.0", "~> 1.7.0" ]

    name: test (solid_queue ${{ matrix.solid_queue }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.3.9
          bundler-cache: false

      - name: Install dependencies (Solid Queue ${{ matrix.solid_queue }})
        env:
          SOLID_QUEUE_VERSION: ${{ matrix.solid_queue }}
        run: |
          rm -f Gemfile.lock
          bundle install --jobs 4 --retry 3

      - name: Run tests
        env:
          RAILS_ENV: test
          SOLID_QUEUE_VERSION: ${{ matrix.solid_queue }}
        run: bin/rails test
